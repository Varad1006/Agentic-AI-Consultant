services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: &backend-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  worker:
    build: .
    command: celery -A app.celery_worker.celery_app worker --loglevel=info --pool=solo
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3001:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  chroma-data:
