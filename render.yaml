services:
  - type: web
    name: agentic-ai-consultant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-demo.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATA_DIR
        value: /tmp/consultant-data
      - key: CORS_ORIGINS
        value: https://agentic-ai-consultant.vercel.app
      - key: MAX_UPLOAD_MB
        value: "2"
      - key: MAX_DOCUMENT_CHARS
        value: "30000"
      - key: MAX_CONTEXT_CHARS
        value: "12000"
      - key: GROQ_API_KEY
        sync: false
